server:
  port: 8082

spring:
  application:
    name: kafka-consumer

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: chat-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.eventstreaming.consumer.model.ChatMessage
    listener:
      observation-enabled: true  # Reads OTel traceparent header from Kafka message → creates child span

app:
  kafka:
    topic: chat-events

logging:
  level:
    com.eventstreaming: DEBUG
    org.springframework.kafka: INFO
    # Suppress verbose Kafka config dumps on startup
    org.apache.kafka.common.config.AbstractConfig: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
