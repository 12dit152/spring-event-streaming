<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kafka Producer — Chat Sender</title>
    <meta name="description" content="Real-time Kafka message producer — send messages to the event stream." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-base:       #0d0f14;
            --bg-surface:    #13161e;
            --bg-card:       #1a1e2a;
            --bg-input:      #1e2330;
            --border:        #2a2f40;
            --border-focus:  #6c63ff;
            --accent:        #6c63ff;
            --accent-glow:   rgba(108, 99, 255, 0.35);
            --accent-hover:  #7d75ff;
            --sent-bubble:   #6c63ff;
            --text-primary:  #e8eaf6;
            --text-secondary:#8b90a8;
            --text-muted:    #555a72;
            --success:       #4caf82;
            --error:         #e05c6a;
            --warning:       #f5a623;
            --radius-sm:     8px;
            --radius-md:     14px;
            --radius-lg:     20px;
            --radius-xl:     28px;
            --shadow-glow:   0 0 30px rgba(108, 99, 255, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(19, 22, 30, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        .header-title { font-size: 17px; font-weight: 600; }
        .header-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

        .status-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.3s ease;
        }

        .status-badge.connected .status-dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-badge.connected { color: var(--success); border-color: rgba(76, 175, 130, 0.3); }
        .status-badge.error .status-dot { background: var(--error); }
        .status-badge.error { color: var(--error); border-color: rgba(224, 92, 106, 0.3); }

        /* ── Sender setup panel ─────────────────────────────────────── */
        .sender-setup {
            padding: 12px 24px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .sender-field {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .sender-field::placeholder { color: var(--text-muted); }
        .sender-field:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }

        .room-tag {
            padding: 6px 12px;
            background: rgba(108, 99, 255, 0.12);
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
            font-weight: 500;
        }

        /* ── Chat window ────────────────────────────────────────────── */
        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .chat-window::-webkit-scrollbar { width: 4px; }
        .chat-window::-webkit-scrollbar-track { background: transparent; }
        .chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            gap: 12px;
        }

        .empty-icon { font-size: 48px; opacity: 0.4; }
        .empty-title { font-size: 16px; font-weight: 500; color: var(--text-secondary); }
        .empty-sub { font-size: 13px; }

        /* Message bubble */
        .message-row {
            display: flex;
            justify-content: flex-end;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px) scale(0.96); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }

        .bubble {
            max-width: 72%;
            background: linear-gradient(135deg, #6c63ff, #8b5cf6);
            border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
            padding: 10px 16px;
            position: relative;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.25);
        }

        .bubble-sender {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }

        .bubble-content {
            font-size: 14px;
            line-height: 1.5;
            color: #fff;
            word-break: break-word;
        }

        .bubble-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            justify-content: flex-end;
        }

        .bubble-time { font-size: 10px; color: rgba(255,255,255,0.5); }
        .bubble-tick { font-size: 12px; color: rgba(255,255,255,0.7); }

        /* System messages */
        .system-msg {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 0;
        }

        /* Toast notification */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            backdrop-filter: blur(20px);
        }

        @keyframes toastIn  { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        .toast.success { background: rgba(76, 175, 130, 0.15); border: 1px solid rgba(76, 175, 130, 0.3); color: var(--success); }
        .toast.error   { background: rgba(224, 92, 106, 0.15); border: 1px solid rgba(224, 92, 106, 0.3); color: var(--error); }

        /* ── Input area ─────────────────────────────────────────────── */
        .input-area {
            padding: 16px 24px;
            background: rgba(19, 22, 30, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 140px;
            transition: border-color 0.2s, box-shadow 0.2s;
            line-height: 1.5;
        }

        .message-input::placeholder { color: var(--text-muted); }
        .message-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .send-btn {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #6c63ff, #8b5cf6);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        .send-btn:hover  { transform: scale(1.05); box-shadow: 0 6px 20px rgba(108, 99, 255, 0.55); }
        .send-btn:active { transform: scale(0.96); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .send-btn.sending {
            animation: pulse 0.6s ease infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4); }
            to   { box-shadow: 0 4px 25px rgba(108, 99, 255, 0.8); }
        }

        .char-count {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 6px;
        }

        .char-count.warn { color: var(--warning); }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 8px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .stat { font-size: 11px; color: var(--text-muted); }
        .stat span { color: var(--text-secondary); font-weight: 600; margin-left: 4px; }

        /* Glow pulse on new message */
        @keyframes borderGlow {
            0%   { box-shadow: 0 0 0 0 var(--accent-glow); }
            50%  { box-shadow: 0 0 0 6px transparent; }
            100% { box-shadow: 0 0 0 0 var(--accent-glow); }
        }
    </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header class="header">
    <div class="header-left">
        <div class="logo-icon">⚡</div>
        <div>
            <div class="header-title">Kafka Producer</div>
            <div class="header-subtitle">Event Streaming — Send Messages</div>
        </div>
    </div>
    <div class="status-badge" id="statusBadge">
        <div class="status-dot"></div>
        <span id="statusText">Checking...</span>
    </div>
</header>

<!-- ── Sender setup ────────────────────────────────────────────────────── -->
<div class="sender-setup">
    <div class="avatar" id="avatar">?</div>
    <input
        type="text"
        id="senderInput"
        class="sender-field"
        placeholder="Your name (sender)..."
        maxlength="30"
        value="Alice"
    />
    <div class="room-tag"># general</div>
</div>

<!-- ── Chat window ─────────────────────────────────────────────────────── -->
<main class="chat-window" id="chatWindow">
    <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <div class="empty-title">Start the conversation</div>
        <div class="empty-sub">Type a message below and hit Send — it'll stream to Kafka instantly.</div>
    </div>
</main>

<!-- ── Stats ──────────────────────────────────────────────────────────── -->
<div class="stats-bar">
    <div class="stat">Sent:<span id="statSent">0</span></div>
    <div class="stat">Topic:<span>chat-events</span></div>
    <div class="stat">Broker:<span>localhost:9092</span></div>
</div>

<!-- ── Input area ──────────────────────────────────────────────────────── -->
<footer class="input-area">
    <div class="input-row">
        <textarea
            id="messageInput"
            class="message-input"
            placeholder="Type a message... (Enter to send, Shift+Enter for new line)"
            rows="1"
            maxlength="500"
        ></textarea>
        <button class="send-btn" id="sendBtn" title="Send message">
            ➤
        </button>
    </div>
    <div class="char-count" id="charCount">0 / 500</div>
</footer>

<!-- ── Toast container ────────────────────────────────────────────────── -->
<div class="toast-container" id="toastContainer"></div>

<script>
    const API_BASE = 'http://localhost:8081/api/messages';
    let sentCount = 0;

    // ── DOM refs ──────────────────────────────────────────────────────────
    const chatWindow   = document.getElementById('chatWindow');
    const emptyState   = document.getElementById('emptyState');
    const messageInput = document.getElementById('messageInput');
    const senderInput  = document.getElementById('senderInput');
    const sendBtn      = document.getElementById('sendBtn');
    const statusBadge  = document.getElementById('statusBadge');
    const statusText   = document.getElementById('statusText');
    const avatar       = document.getElementById('avatar');
    const charCount    = document.getElementById('charCount');
    const statSent     = document.getElementById('statSent');
    const toastContainer = document.getElementById('toastContainer');

    // ── Avatar initials update ────────────────────────────────────────────
    function updateAvatar() {
        const name = senderInput.value.trim();
        avatar.textContent = name ? name[0].toUpperCase() : '?';
        const hue = [...name].reduce((h, c) => h + c.charCodeAt(0), 0) % 360;
        avatar.style.background = `linear-gradient(135deg, hsl(${hue},65%,55%), hsl(${(hue+40)%360},65%,65%))`;
    }
    senderInput.addEventListener('input', updateAvatar);
    updateAvatar();

    // ── Char counter ──────────────────────────────────────────────────────
    messageInput.addEventListener('input', () => {
        const len = messageInput.value.length;
        charCount.textContent = `${len} / 500`;
        charCount.className = 'char-count' + (len > 430 ? ' warn' : '');
        autoResize();
    });

    function autoResize() {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
    }

    // ── Enter to send ─────────────────────────────────────────────────────
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ── Health check ──────────────────────────────────────────────────────
    async function checkHealth() {
        try {
            const res = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(3000) });
            if (res.ok) {
                setStatus('connected', '● Producer Ready');
            } else {
                setStatus('error', '✗ Service Error');
            }
        } catch {
            setStatus('error', '✗ Offline');
        }
    }

    function setStatus(state, text) {
        statusBadge.className = 'status-badge ' + state;
        statusText.textContent = text;
    }

    // ── Send message ──────────────────────────────────────────────────────
    async function sendMessage() {
        const content = messageInput.value.trim();
        const sender  = senderInput.value.trim() || 'Anonymous';

        if (!content) return;

        sendBtn.disabled = true;
        sendBtn.classList.add('sending');
        sendBtn.textContent = '⏳';

        try {
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender, content, room: 'general' }),
                signal: AbortSignal.timeout(5000)
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const msg = await res.json();
            appendBubble(msg);
            messageInput.value = '';
            autoResize();
            charCount.textContent = '0 / 500';
            charCount.className = 'char-count';
            sentCount++;
            statSent.textContent = sentCount;
            showToast('✓ Message published to Kafka', 'success');
            setStatus('connected', '● Producer Ready');

        } catch (err) {
            console.error('Send failed:', err);
            showToast('✗ Failed to send — is the producer running?', 'error');
            setStatus('error', '✗ Send Failed');
        } finally {
            sendBtn.disabled = false;
            sendBtn.classList.remove('sending');
            sendBtn.textContent = '➤';
        }
    }

    // ── Render bubble ─────────────────────────────────────────────────────
    function appendBubble(msg) {
        // Remove empty state
        if (emptyState.parentNode) emptyState.remove();

        const time = msg.timestamp
            ? new Date(msg.timestamp.replace(' ', 'T')).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const row = document.createElement('div');
        row.className = 'message-row';
        row.innerHTML = `
            <div class="bubble">
                <div class="bubble-sender">${escHtml(msg.sender)}</div>
                <div class="bubble-content">${escHtml(msg.content)}</div>
                <div class="bubble-meta">
                    <span class="bubble-time">${time}</span>
                    <span class="bubble-tick">✓✓</span>
                </div>
            </div>
        `;
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // ── Toast ──────────────────────────────────────────────────────────────
    function showToast(msg, type = 'success') {
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        toastContainer.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // ── Util ───────────────────────────────────────────────────────────────
    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ── Load history on startup ────────────────────────────────────────────
    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/history`, { signal: AbortSignal.timeout(3000) });
            if (!res.ok) return;
            const messages = await res.json();
            messages.forEach(msg => appendBubble(msg));
            if (messages.length > 0) {
                sentCount = messages.length;
                statSent.textContent = sentCount;
            }
        } catch { /* History unavailable — ignore */ }
    }

    // ── Init ───────────────────────────────────────────────────────────────
    checkHealth();
    loadHistory();
    setInterval(checkHealth, 15000);
    messageInput.focus();
</script>
</body>
</html>
